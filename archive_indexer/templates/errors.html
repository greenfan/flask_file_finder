<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Errors</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; background: #0f172a; color: #e2e8f0; }
    a { color: #93c5fd; }
    .card { background: #111827; border: 1px solid #334155; border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid #334155; padding: 0.5rem; text-align: left; vertical-align: top; }
  </style>
</head>
<body>
  <h1>Scan errors</h1>
  <p><a href="/">Back</a></p>
  <div class="card">
    <table>
      <thead><tr><th>Path</th><th>Error</th><th>Timestamp</th></tr></thead>
      <tbody>
      {% for row in rows %}
        <tr>
          <td>{{ row['path'] }}</td>
          <td>{{ row['error'] }}</td>
          <td>{{ _human_ts(row['timestamp']) }}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
