[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archive-indexer"
version = "0.1.0"
description = "Recursive archive/compressed file finder with Flask UI"
requires-python = ">=3.10"
dependencies = ["Flask>=3.0,<4"]

[project.scripts]
archive-indexer = "archive_indexer.cli:main"
